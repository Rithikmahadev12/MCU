<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Stark OS</title>
		<link rel="shortcut icon" href="favicon.ico" />

		<!-- Auth gate: must run before anything else renders -->
		<script src="auth-guard.js"></script>

		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>

		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="index.css" />
		<link rel="stylesheet" href="desktop.css" />

		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="browser-app.js" defer></script>
		<script src="desktop.js" defer></script>
	</head>

	<body class="os-body">
		<div class="desktop" id="desktop">
			<div class="desktop-bg-grid"></div>

			<!-- Desktop icons -->
			<div class="desktop-icons">
				<button class="desktop-icon" data-app="browser">
					<span class="icon-glyph">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
							<circle cx="12" cy="12" r="9" />
							<path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z" />
						</svg>
					</span>
					<span class="icon-label">Browser</span>
				</button>
				<button class="desktop-icon" data-app="notes">
					<span class="icon-glyph">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
							<path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" />
							<path d="M14 3v5h5M8 12h8M8 16h5" />
						</svg>
					</span>
					<span class="icon-label">Notes</span>
				</button>
				<button class="desktop-icon" data-app="system">
					<span class="icon-glyph">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
							<rect x="3" y="4" width="18" height="13" rx="1" />
							<path d="M8 21h8M12 17v4" />
						</svg>
					</span>
					<span class="icon-label">System</span>
				</button>
			</div>

			<!-- Windows get created here by desktop.js -->
			<div class="windows-layer" id="windows-layer"></div>

			<!-- Taskbar -->
			<div class="taskbar">
				<button class="start-btn" id="start-btn">
					<span class="start-dot"></span>
					Stark OS
				</button>
				<div class="taskbar-running" id="taskbar-running"></div>
				<div class="taskbar-right">
					<span id="taskbar-clock" class="taskbar-clock"></span>
					<button class="logout-btn" id="logout-btn" title="Log out">
						Log out
					</button>
				</div>
			</div>
		</div>

		<!-- Browser app template (moved out of the way, cloned into a window) -->
		<template id="browser-app-template">
			<div class="browser-app">
				<form id="sj-form" class="browser-form">
					<input
						id="sj-search-engine"
						value="https://www.google.com/search?q=%s"
						type="hidden"
					/>
					<input
						id="sj-address"
						type="text"
						placeholder="Search or enter address"
						autocomplete="off"
					/>
					<button type="submit" class="browser-go-btn">Go</button>
				</form>
				<div class="browser-status">
					<p id="sj-error"></p>
					<pre id="sj-error-code"></pre>
				</div>
				<div class="browser-frame-holder" id="browser-frame-holder"></div>
			</div>
		</template>

		<!-- Notes app template -->
		<template id="notes-app-template">
			<div class="notes-app">
				<textarea
					id="notes-textarea"
					placeholder="Notes are saved locally in this browser."
				></textarea>
			</div>
		</template>

		<!-- System app template -->
		<template id="system-app-template">
			<div class="system-app">
				<dl class="system-list">
					<dt>Proxy</dt>
					<dd>Scramjet (Mercury Workshop)</dd>
					<dt>Session</dt>
					<dd>Local, browser-only</dd>
					<dt>Access</dt>
					<dd>Client-side lock — not a security boundary</dd>
				</dl>
				<p><a href="credits.html">Third-party licenses</a></p>
			</div>
		</template>
	</body>
</html>
