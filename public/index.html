<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>MCU OS</title>
		<link rel="shortcut icon" href="favicon.ico" />

		<!-- Auth gate: must run before anything else renders -->
		<script src="auth-guard.js"></script>

		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>

		<link
			href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@300;400;500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="index.css" />
		<link rel="stylesheet" href="desktop.css" />

		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="browser-app.js" defer></script>
		<script src="desktop.js" defer></script>
	</head>

	<body class="os-body">
		<div class="desktop" id="desktop">
			<div class="desktop-bg-grid"></div>
			<div class="reactor-glow reactor-glow-a"></div>
			<div class="reactor-glow reactor-glow-b"></div>

			<!-- Desktop icons -->
			<div class="desktop-icons">
				<button class="desktop-icon" data-app="browser">
					<span class="icon-glyph icon-browser"></span>
					<span class="icon-label">Browser</span>
				</button>
				<button class="desktop-icon" data-app="notes">
					<span class="icon-glyph icon-notes"></span>
					<span class="icon-label">F.R.I.D.A.Y. Notes</span>
				</button>
				<button class="desktop-icon" data-app="about">
					<span class="icon-glyph icon-about"></span>
					<span class="icon-label">About MCU OS</span>
				</button>
			</div>

			<!-- Windows get created here by desktop.js -->
			<div class="windows-layer" id="windows-layer"></div>

			<!-- Taskbar -->
			<div class="taskbar">
				<button class="start-btn" id="start-btn">
					<span class="start-glyph"></span>
					MCU OS
				</button>
				<div class="taskbar-running" id="taskbar-running"></div>
				<div class="taskbar-right">
					<span id="taskbar-clock" class="taskbar-clock"></span>
					<button class="logout-btn" id="logout-btn" title="Log out">
						Log out
					</button>
				</div>
			</div>
		</div>

		<!-- Browser app template (moved out of the way, cloned into a window) -->
		<template id="browser-app-template">
			<div class="browser-app">
				<form id="sj-form" class="browser-form">
					<input
						id="sj-search-engine"
						value="https://www.google.com/search?q=%s"
						type="hidden"
					/>
					<input
						id="sj-address"
						type="text"
						placeholder="Search the web freely"
						autocomplete="off"
					/>
					<button type="submit" class="browser-go-btn">Go</button>
				</form>
				<div class="browser-status">
					<p id="sj-error"></p>
					<pre id="sj-error-code"></pre>
				</div>
				<div class="browser-frame-holder" id="browser-frame-holder"></div>
			</div>
		</template>

		<!-- Notes app template -->
		<template id="notes-app-template">
			<div class="notes-app">
				<textarea
					id="notes-textarea"
					placeholder="Debrief notes, Avenger... (saved locally in this browser)"
				></textarea>
			</div>
		</template>

		<!-- About app template -->
		<template id="about-app-template">
			<div class="about-app">
				<h2>MCU OS</h2>
				<p>
					A personal, home-lab desktop UI built on top of
					<a href="https://github.com/MercuryWorkshop/Scramjet-Demo" target="_blank" rel="noreferrer">Scramjet</a>,
					the web proxy by Mercury Workshop.
				</p>
				<p class="about-note">
					This login screen is a client-side convenience gate for a local
					project — it is not real security.
				</p>
				<p><a href="credits.html">View third-party licenses</a></p>
			</div>
		</template>
	</body>
</html>
