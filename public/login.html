<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Stark OS | Access Terminal</title>
		<link rel="shortcut icon" href="favicon.ico" />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="index.css" />
		<link rel="stylesheet" href="login.css" />
	</head>

	<body class="login-body">
		<svg class="hud-ring" viewBox="0 0 400 400" aria-hidden="true">
			<circle cx="200" cy="200" r="150" />
			<circle cx="200" cy="200" r="120" stroke-dasharray="2 10" />
			<g class="hud-ticks">
				<line x1="200" y1="20" x2="200" y2="45" />
				<line x1="200" y1="355" x2="200" y2="380" />
				<line x1="20" y1="200" x2="45" y2="200" />
				<line x1="355" y1="200" x2="380" y2="200" />
			</g>
		</svg>

		<div class="grid-overlay" aria-hidden="true"></div>

		<main class="terminal">
			<div class="terminal-corner tl"></div>
			<div class="terminal-corner tr"></div>
			<div class="terminal-corner bl"></div>
			<div class="terminal-corner br"></div>

			<p class="terminal-eyebrow">Stark Industries</p>
			<h1 class="terminal-title">STARK OS</h1>
			<p class="terminal-sub">Personal access terminal</p>

			<form id="login-form" autocomplete="off">
				<label class="field">
					<span class="field-label">User</span>
					<input
						id="login-username"
						type="text"
						autocomplete="username"
						required
					/>
				</label>

				<label class="field">
					<span class="field-label">Passcode</span>
					<input
						id="login-password"
						type="password"
						autocomplete="current-password"
						required
					/>
				</label>

				<button type="submit" class="login-btn">Authenticate</button>

				<p id="login-error" class="login-error"></p>
			</form>

			<p class="terminal-footnote">Local session lock. Not a security boundary.</p>
		</main>

		<script src="login.js" defer></script>
	</body>
</html>
