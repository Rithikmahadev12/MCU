<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>MCU OS | Sign In</title>
		<link rel="shortcut icon" href="favicon.ico" />
		<link
			href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@300;400;500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="index.css" />
		<link rel="stylesheet" href="login.css" />
	</head>

	<body class="login-body">
		<div class="reactor-glow reactor-glow-a"></div>
		<div class="reactor-glow reactor-glow-b"></div>

		<div class="login-card">
			<div class="reactor-ring">
				<div class="reactor-core"></div>
			</div>

			<h1 class="login-title">MCU <span>OS</span></h1>
			<p class="login-subtitle">Stark Industries Secure Access</p>

			<form id="login-form" autocomplete="off">
				<label class="field">
					<span class="field-label">Username</span>
					<input
						id="login-username"
						type="text"
						placeholder="Agent identifier"
						autocomplete="username"
						required
					/>
				</label>

				<label class="field">
					<span class="field-label">Password</span>
					<input
						id="login-password"
						type="password"
						placeholder="Access code"
						autocomplete="current-password"
						required
					/>
				</label>

				<button type="submit" class="login-btn">
					<span>Authenticate</span>
				</button>

				<p id="login-error" class="login-error"></p>
			</form>

			<p class="login-footer">Unauthorized access will be reported to F.R.I.D.A.Y.</p>
		</div>

		<script src="login.js" defer></script>
	</body>
</html>
